<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinZ - Verification Complete</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0D1017;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1A1F2B;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #2DD4BF; }
    p { font-size: 14px; color: #9CA3AF; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10003;</div>
    <h1>DigiLocker Complete</h1>
    <p>This window will close automatically.<br/>Please return to the FinZ app.</p>
  </div>
  <script>
    // Try closing immediately (works for window.open popups)
    setTimeout(function() { window.close(); }, 1500);
    // Fallback: if window.close() doesn't work (not a popup), show message
    setTimeout(function() {
      document.querySelector('p').textContent = 'You can close this tab and return to FinZ.';
    }, 3000);
  </script>
</body>
</html>
